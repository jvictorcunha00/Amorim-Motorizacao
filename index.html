<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Amorim Motorização</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 700px;
      min-height: 100vh;
      background: #fff;
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      text-align: center;
    }

    .app {
      display: flex;
      flex-direction: column;
    }

    #conteudo {
      flex: 1;
    }

    .rodape {
      margin-top: auto;
      padding-top: 36px;
      text-align: center;
      color: #888;
      font-size: 12px;
      line-height: 1.6;
    }

    .tela-inicial,
    .tela-cadastro,
    .tela-confirmacao-cadastro {
      max-width: 520px;
      margin: 30px auto 0;
    }

    .tela-inicial {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 58vh;
    }

    .tela-inicial-titulo {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .tela-inicial-subtitulo {
      text-align: center;
      font-size: 16px;
      line-height: 1.5;
      color: #666;
      margin-bottom: 28px;
    }

    .botoes-acesso {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-sem-cadastro {
      display: block;
      margin-top: 18px;
      color: #777;
      font-size: 13px;
      text-align: center;
      text-decoration: underline;
      cursor: pointer;
    }

    .link-sem-cadastro:hover {
      color: #222;
    }

    .botao-acesso {
      width: 100%;
      min-height: 58px;
      padding: 16px 20px;
      border: none;
      border-radius: 22px;
      background: #222;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .botao-acesso:hover {
      background: #444;
      transform: translateY(-1px);
    }

    .botao-acesso.secundario {
      background: #f1f1f1;
      color: #222;
      border: 1px solid #ddd;
    }

    .botao-acesso.secundario:hover {
      background: #e7e7e7;
    }

    .campos-cadastro {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .campo-cadastro {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .campo-cadastro label {
      font-size: 14px;
      font-weight: bold;
      color: #555;
    }

    .campo-cadastro input {
      width: 100%;
      min-height: 52px;
      padding: 13px 14px;
      border: 1px solid #ccc;
      border-radius: 16px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    .campo-cadastro input:focus {
      border-color: #888;
    }

    .campo-cadastro input.campo-invalido {
      border-color: #d33;
      background: rgba(220, 0, 0, 0.08);
    }

    .mensagem-validacao {
      display: none;
      color: #b00020;
      font-size: 13px;
      line-height: 1.4;
      margin-top: 2px;
    }

    .campo-cadastro.tem-erro .mensagem-validacao {
      display: block;
    }

    .campo-senha {
      position: relative;
    }

    .campo-senha input {
      padding-right: 52px;
    }

    .botao-visualizar-senha {
      position: absolute;
      right: 10px;
      bottom: 8px;
      width: 40px;
      height: 36px;
      border: none;
      background: transparent;
      color: #666;
      cursor: pointer;
      font-size: 19px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .botao-visualizar-senha:hover {
      background: #f0f0f0;
    }

    .botao-visualizar-senha svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .termos-cadastro {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
      padding: 16px;
      border-radius: 18px;
      background: #f8f8f8;
      border: 1px solid #e5e5e5;
    }

    .termo-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 14px;
      line-height: 1.45;
      color: #444;
    }

    .link-termos {
      color: inherit;
      text-decoration: underline;
      font-weight: bold;
    }

    .link-termos:hover {
      opacity: 0.75;
    }

    .termo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 2px 0 0;
      flex-shrink: 0;
    }

    .botao-continuar-cadastro {
      width: 100%;
      min-height: 56px;
      margin-top: 18px;
      padding: 14px 18px;
      border: none;
      border-radius: 20px;
      background: #222;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .botao-continuar-cadastro:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .tela-confirmacao-cadastro {
      text-align: center;
    }

    .confirmacao-titulo {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .confirmacao-texto {
      font-size: 16px;
      color: #555;
      line-height: 1.55;
      margin-bottom: 26px;
    }

    .confirmacao-acoes {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tela-login {
      max-width: 520px;
      margin: 30px auto 0;
    }

    .login-acoes {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 18px;
    }

    .mensagem-login {
      display: none;
      color: #b00020;
      font-size: 13px;
      line-height: 1.4;
      margin-top: 2px;
    }

    .mensagem-login.visivel {
      display: block;
    }


    .link-esqueci-senha {
      display: inline-block;
      margin-top: 8px;
      color: #555;
      font-size: 14px;
      text-decoration: underline;
      cursor: pointer;
      text-align: center;
    }

    .link-esqueci-senha:hover {
      color: #222;
    }

    .tela-recuperacao {
      max-width: 520px;
      margin: 30px auto 0;
    }

    .mensagem-recuperacao {
      display: none;
      color: #b00020;
      font-size: 13px;
      line-height: 1.4;
      margin-top: 2px;
    }

    .mensagem-recuperacao.visivel {
      display: block;
    }

    .recuperacao-sucesso {
      text-align: center;
    }

    .recuperacao-sucesso .verificacao-botao {
      margin-left: auto;
      margin-right: auto;
    }
    .campo-reenvio {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 20px;
      text-align: left;
    }

    .campo-reenvio label {
      font-size: 14px;
      font-weight: bold;
      color: #555;
    }

    .campo-reenvio input {
      width: 100%;
      min-height: 52px;
      padding: 13px 14px;
      border: 1px solid #ccc;
      border-radius: 16px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    .campo-reenvio input:focus {
      border-color: #888;
    }

    .campo-reenvio input.campo-invalido {
      border-color: #d33;
      background: rgba(220, 0, 0, 0.08);
    }

    .mensagem-reenvio {
      display: none;
      color: #b00020;
      font-size: 13px;
      line-height: 1.4;
      margin-top: 2px;
    }

    .campo-reenvio.tem-erro .mensagem-reenvio {
      display: block;
    }

    @media (max-width: 600px) {
      .app {
        padding: 20px 16px;
      }

      .tela-inicial {
        min-height: 62vh;
      }
    }

    .status {
      color: #777;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .question {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .choice {
      width: 100%;
      min-height: 60px;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 12px;
      background: #fff;
      text-align: left;
      font-size: 17px;
      cursor: pointer;
    }

    .choice:hover {
      background: #f2f2f2;
    }

    .loading {
      padding: 16px;
      border-radius: 12px;
      background: #f0f0f0;
      color: #666;
    }

    .error {
      padding: 16px;
      border-radius: 12px;
      background: #ffecec;
      color: #a00;
    }

    .resultado {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .resultado-titulo {
      font-size: 22px;
      font-weight: bold;
      line-height: 1.3;
    }

    .resultado-bloco {
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fafafa;
    }

    .resultado-label {
      font-size: 14px;
      font-weight: bold;
      color: #777;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .resultado-texto {
      font-size: 17px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .botao-video {
      width: 100%;
      min-height: 55px;
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .botao-video:hover {
      background: #444;
    }

    .botao-reiniciar {
      width: 100%;
      min-height: 55px;
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: #fff;
      font-size: 17px;
      cursor: pointer;
    }

    .botao-reiniciar:hover {
      background: #444;
    }

    /* =========================
       INTRODUÇÃO
    ========================= */

    .introducao {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .introducao-texto {
      font-size: 17px;
      line-height: 1.55;
      color: #333;
      white-space: pre-line;
    }

    .aviso-inicial {
      padding: 16px;
      border: 1px solid #ddd;
      border-left: 4px solid #222;
      border-radius: 12px;
      background: #fafafa;
      color: #333;
      font-size: 15px;
      line-height: 1.5;
    }

    .aviso-inicial strong {
      display: block;
      margin-bottom: 6px;
    }

    .campo-introducao {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .campo-introducao label {
      font-size: 14px;
      font-weight: bold;
      color: #555;
    }

    .campo-introducao input {
      width: 100%;
      min-height: 55px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 17px;
      outline: none;
    }

    .campo-introducao input:focus {
      border-color: #888;
    }

    .botao-continuar {
      width: 100%;
      min-height: 55px;
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .botao-continuar:hover {
      background: #444;
    }

    .botao-continuar:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* =========================
       AVALIAÇÃO
    ========================= */

    .avaliacao {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .avaliacao-texto {
      font-size: 17px;
      line-height: 1.55;
      color: #333;
    }

    .estrelas {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 8px 0;
    }

    .estrela {
      border: none;
      background: transparent;
      font-size: 42px;
      line-height: 1;
      color: #ccc;
      cursor: pointer;
      padding: 4px;
      transition: transform 0.15s ease;
    }

    .estrela:hover {
      transform: scale(1.08);
    }

    .estrela.selecionada {
      color: #f5b301;
    }

    .avaliacao-nota {
      text-align: center;
      font-size: 14px;
      color: #777;
      min-height: 20px;
    }

    .campo-feedback {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .campo-feedback label {
      font-size: 14px;
      font-weight: bold;
      color: #555;
    }

    .campo-feedback textarea {
      width: 100%;
      min-height: 120px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }

    .campo-feedback textarea:focus {
      border-color: #888;
    }

    .campo-feedback textarea::placeholder {
      color: #999;
    }

    .botao-avaliacao {
      width: 100%;
      min-height: 55px;
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .botao-avaliacao:hover {
      background: #444;
    }

    .botao-avaliacao:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* =========================
       FINALIZAÇÃO
    ========================= */

    .finalizacao {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

    .finalizacao-icone {
      font-size: 48px;
    }

    .finalizacao-texto {
      font-size: 17px;
      line-height: 1.55;
      color: #333;
    }


    /* =========================
       CONFIRMAÇÃO DE E-MAIL
    ========================= */

    .verificacao {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
      padding: 40px 20px;
    }

    .verificacao-icone {
      font-size: 52px;
      line-height: 1;
    }

    .verificacao-titulo {
      font-size: 24px;
      font-weight: bold;
    }

    .verificacao-texto {
      font-size: 17px;
      line-height: 1.55;
      color: #333;
      max-width: 520px;
    }

    .verificacao-botao {
      width: 100%;
      max-width: 360px;
      min-height: 55px;
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .verificacao-botao:hover {
      background: #444;
    }

  </style>

</head>

<body>

  <div class="app">

    <h1>Amorim Motorização</h1>

    <div
      id="status"
      class="status"
    >
      Iniciando atendimento...
    </div>

    <div id="conteudo"></div>

    <div class="rodape">
      <div>Desenvolvido por: João Victor da Costa P. da Cunha</div>
      <div>Contato: 21993943415</div>
    </div>

  </div>


  <script>

    /* =====================================================
       URL DO WEB APP
    ===================================================== */

    const URL_API =
      "https://script.google.com/macros/s/AKfycbz8P23T3_yuIUCIICEw9lZ3msR9MrbtXCEkAE5tfHmJcDVLjRS5Xt0XEW73hzOETnz1Fw/exec";


    /* =====================================================
       URL PARA CONFIRMAÇÃO DE E-MAIL
    ===================================================== */

    const URL_VERIFICACAO =
      "https://script.google.com/macros/s/AKfycbx3HlA3Y_TA3isEe84CmydN815o83DE4wiwuBh719VcFFHVnDu8mLYgMxIfVtd5AQYP/exec";


    /* =====================================================
       ELEMENTOS DA TELA
    ===================================================== */

    const status =
      document.getElementById("status");

    const conteudo =
      document.getElementById("conteudo");


    /* =====================================================
       ESTADO DO ATENDIMENTO
    ===================================================== */

    window.nomeInstalador = "";

    window.revenda = "";

    window.idInstalador = "";

    window.emailInstalador = "";

    window.statusInstalador = "";

    window.modoSemCadastro = false;

    window.motorSelecionado = null;

    window.controleSelecionado = null;

    window.problemaSelecionado = null;

    window.avaliacaoSelecionada = 0;

    window.feedback = "";


    /* =====================================================
       CHAMADA PARA O APPS SCRIPT
    ===================================================== */

    async function chamarAPI(dados) {

      const resposta =
        await fetch(
          URL_API,
          {
            method: "POST",

            headers: {
              "Content-Type": "text/plain"
            },

            body: JSON.stringify(dados)
          }
        );


      return await resposta.json();

    }


    /* =====================================================
       TELA INICIAL
    ===================================================== */

    function apresentarTelaInicial() {

      status.textContent =
        "Acesso";

      conteudo.innerHTML = `
        <div class="tela-inicial">

          <div class="tela-inicial-titulo">
            Bem-vindo à Amorim Motorização
          </div>

          <div class="tela-inicial-subtitulo">
            Acesse sua conta, crie seu cadastro ou continue sem cadastro.
          </div>

          <div class="botoes-acesso">

            <button
              type="button"
              class="botao-acesso"
              id="btnEntrar"
            >
              Entrar
            </button>

            <button
              type="button"
              class="botao-acesso secundario"
              id="btnCadastro"
            >
              Cadastre-se
            </button>

          </div>

          <a
            href="#"
            class="link-sem-cadastro"
            id="btnSemCadastro"
          >
            Continuar sem cadastro
          </a>

        </div>
      `;

      document
        .getElementById("btnEntrar")
        .addEventListener(
          "click",
          function() {

            window.modoSemCadastro =
              false;

            apresentarLogin();

          }
        );

      document
        .getElementById("btnCadastro")
        .addEventListener(
          "click",
          function() {

            apresentarCadastro();

          }
        );

      document
        .getElementById("btnSemCadastro")
        .addEventListener(
          "click",
          function(event) {

            event.preventDefault();

            window.modoSemCadastro =
              true;

            apresentarIntroducao(true);

          }
        );

    }


    /* =====================================================
       LOGIN
    ===================================================== */

    function apresentarLogin() {

      status.textContent =
        "Entrar";

      conteudo.innerHTML = `
        <div class="tela-login">

          <div class="resultado-titulo">
            Acesse sua conta
          </div>

          <div class="introducao-texto">
            Informe seu e-mail e senha para continuar.
          </div>

          <div class="campos-cadastro">

            <div class="campo-cadastro">
              <label for="loginEmail">
                E-mail
              </label>

              <input
                type="email"
                id="loginEmail"
                placeholder="Digite seu e-mail"
                autocomplete="email"
                required
              >
            </div>

            <div class="campo-cadastro">
              <label for="loginSenha">
                Senha
              </label>

              <div class="campo-senha">
                <input
                  type="password"
                  id="loginSenha"
                  placeholder="Digite sua senha"
                  autocomplete="current-password"
                  required
                >

                <button
                  type="button"
                  class="botao-visualizar-senha"
                  id="btnMostrarLoginSenha"
                  aria-label="Mostrar senha"
                  title="Mostrar senha"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Zm9.5 3a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg>
                </button>
              </div>

              <a
                href="#"
                class="link-esqueci-senha"
                id="btnEsqueciSenha"
              >
                Esqueci minha senha
              </a>

              <div
                class="mensagem-login"
                id="erroLogin"
              ></div>
            </div>

          </div>

          <div class="login-acoes">

            <button
              type="button"
              class="botao-continuar-cadastro"
              id="btnLogin"
            >
              Entrar
            </button>

            <button
              type="button"
              class="botao-acesso secundario"
              id="btnVoltarLogin"
            >
              Voltar
            </button>

          </div>

        </div>
      `;

      const email =
        document.getElementById("loginEmail");

      const senha =
        document.getElementById("loginSenha");

      const erro =
        document.getElementById("erroLogin");

      const botaoLogin =
        document.getElementById("btnLogin");

      const botaoVoltar =
        document.getElementById("btnVoltarLogin");

      const botaoEsqueci =
        document.getElementById("btnEsqueciSenha");

      const botaoMostrarLoginSenha =
        document.getElementById("btnMostrarLoginSenha");

      botaoMostrarLoginSenha.addEventListener(
        "click",
        function() {

          const mostrando =
            senha.type === "text";

          senha.type =
            mostrando ? "password" : "text";

          botaoMostrarLoginSenha.innerHTML =
            mostrando

      botaoLogin.addEventListener(
        "click",
        async function() {

          const emailInformado =
            email.value
              .trim()
              .toLowerCase();

          const senhaInformada =
            senha.value;

          if (!emailInformado) {

            mostrarErro(
              "Informe seu e-mail."
            );

            email.focus();

            return;

          }

          if (!senhaInformada) {

            mostrarErro(
              "Informe sua senha."
            );

            senha.focus();

            return;

          }

          botaoLogin.disabled =
            true;

          botaoLogin.textContent =
            "Entrando...";

          erro.textContent =
            "";

          erro.classList.remove(
            "visivel"
          );

          try {

            const resultado =
              await chamarAPI({
                acao:
                  "autenticarInstalador",
                email:
                  emailInformado,
                senha:
                  senhaInformada
              });

            if (
              !resultado ||
              !resultado.sucesso
            ) {

              if (
                resultado &&
                resultado.senhaAnterior
              ) {

                mostrarErro(
                  gerarMensagemIdadeSenha(
                    resultado.dataRedefinicao
                  )
                );

                botaoLogin.disabled =
                  false;

                botaoLogin.textContent =
                  "Entrar";

                return;

              }

              throw new Error(
                (
                  resultado &&
                  resultado.erro
                ) ||
                "E-mail ou senha inválidos."
              );

            }

            window.idInstalador =
              resultado.id || "";

            window.nomeInstalador =
              (
                (resultado.primeiroNome || "") +
                " " +
                (resultado.sobrenome || "")
              ).trim();

            window.emailInstalador =
              resultado.email ||
              emailInformado;

            window.statusInstalador =
              resultado.status || "";

            window.dataRedefinicaoSenha =
              resultado.dataRedefinicao || "";

            window.modoSemCadastro =
              false;

            apresentarIntroducao(false);

          } catch (erroLogin) {

            console.error(
              "Erro ao autenticar instalador:",
              erroLogin
            );

            mostrarErro(
              erroLogin.message ||
              "Não foi possível realizar o login."
            );

            botaoLogin.disabled =
              false;

            botaoLogin.textContent =
              "Entrar";

          }

        }
      );

      email.focus();

    }


    function gerarMensagemIdadeSenha(dataRedefinicao) {

      if (!dataRedefinicao) {
        return "Esta senha foi substituída por uma nova senha.";
      }

      const data =
        new Date(dataRedefinicao);

      if (isNaN(data.getTime())) {
        return "Esta senha foi substituída por uma nova senha.";
      }

      const agora =
        new Date();

      const dias =
        Math.max(
          0,
          Math.floor(
            (agora.getTime() - data.getTime()) /
            (1000 * 60 * 60 * 24)
          )
        );

      if (dias <= 30) {

        return
          "Esta senha foi substituída por uma nova senha. A senha foi redefinida há " +
          dias +
          (dias === 1 ? " dia." : " dias.");

      }

      const meses =
        Math.max(
          1,
          Math.floor(dias / 30)
        );

      return
        "Esta senha foi substituída por uma nova senha. A senha foi redefinida há " +
        meses +
        (meses === 1 ? " mês." : " meses.");

    }

            campo.type === "text";

          campo.type =
            mostrando ? "password" : "text";

          botaoOlho.innerHTML =
            mostrando
              ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Zm9.5 3a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg>'

            mostrando ? "Mostrar senha" : "Ocultar senha"

        novaSenha

        confirmacao
      );

        /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;

            "A confirmação da senha não corresponde.";

            grupoNovaSenha.classList.add("tem-erro");
            novaSenha.classList.add("campo-invalido");

              "Não foi possível redefinir a senha.";
          }

          botao.disabled = false;
          botao.textContent = "Redefinir senha";

        }

      });

      novaSenha.focus();

    }

            type="button"
            class="botao-continuar-cadastro"
            id="btnContinuarCadastro"
            disabled
          >
            Continuar
          </button>

        </div>
      `;

      const primeiroNome =
        document.getElementById("cadastroPrimeiroNome");
      const sobrenome =
        document.getElementById("cadastroSobrenome");
      const email =
        document.getElementById("cadastroEmail");
      const contato =
        document.getElementById("cadastroContato");
      const senha =
        document.getElementById("cadastroSenha");
      const confirmacaoSenha =
        document.getElementById("cadastroConfirmacaoSenha");

      const grupos = {
        primeiroNome: document.getElementById("grupoPrimeiroNome"),
        sobrenome: document.getElementById("grupoSobrenome"),
        email: document.getElementById("grupoEmail"),
        contato: document.getElementById("grupoContato"),
        senha: document.getElementById("grupoSenha"),
        confirmacaoSenha: document.getElementById("grupoConfirmacaoSenha")
      };

      const mensagens = {
        primeiroNome: document.getElementById("erroPrimeiroNome"),
        sobrenome: document.getElementById("erroSobrenome"),
        email: document.getElementById("erroEmail"),
        contato: document.getElementById("erroContato"),
        senha: document.getElementById("erroSenha"),
        confirmacaoSenha: document.getElementById("erroConfirmacaoSenha")
      };

      const camposCadastro = [
        primeiroNome,
        sobrenome,
        email,
        contato,
        senha,
        confirmacaoSenha
      ];

      const linkTermos = document.getElementById("linkTermos");

      if (linkTermos) {
        linkTermos.addEventListener("click", function(event) {
          event.preventDefault();
          alert("O link para os Termos e Condições será configurado posteriormente.");
        });
      }

      const checkboxes = [
        document.getElementById("checkTermos"),
        document.getElementById("checkDados"),
        document.getElementById("checkEmail")
      ];

      const botaoContinuar =
        document.getElementById("btnContinuarCadastro");

      const regexNome =
        /^[A-Za-zÀ-ÖØ-öø-ÿ]+(?:[ '-][A-Za-zÀ-ÖØ-öø-ÿ]+)*$/;
      const regexEmail =
        /^[^\s@]+@(gmail|outlook|live|hotmail)\.com$/i;
      const regexSenha =
        /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;

      function formatarContato(valor) {
        const numeros =
          valor.replace(/\D/g, "").slice(0, 11);

        if (!numeros) return "";
        if (numeros.length <= 2) return "(" + numeros;
        if (numeros.length <= 3) {
          return "(" + numeros.slice(0, 2) + ") " + numeros.slice(2);
        }
        if (numeros.length <= 7) {
          return "(" + numeros.slice(0, 2) + ") " + numeros.slice(2, 3) + " " + numeros.slice(3);
        }
        return "(" + numeros.slice(0, 2) + ") " + numeros.slice(2, 3) + " " + numeros.slice(3, 7) + "-" + numeros.slice(7, 11);
      }

      function definirValidacao(nome, valido, mensagem) {
        const grupo = grupos[nome];
        const campo = {
          primeiroNome,
          sobrenome,
          email,
          contato,
          senha,
          confirmacaoSenha
        }[nome];
        const elementoMensagem = mensagens[nome];

        if (valido || campo.value.trim() === "") {
          grupo.classList.remove("tem-erro");
          campo.classList.remove("campo-invalido");
          elementoMensagem.textContent = "";
          return valido;
        }

        grupo.classList.add("tem-erro");
        campo.classList.add("campo-invalido");
        elementoMensagem.textContent = mensagem;
        return false;
      }

      function validarNomeCampo(campo, nome, mensagem) {
        const valor = campo.value.trim();
        const valido = valor !== "" && regexNome.test(valor);
        return definirValidacao(nome, valido, mensagem);
      }

      function validarEmail() {
        const valor = email.value.trim();
        const valido = valor !== "" && regexEmail.test(valor);
        return definirValidacao(
          "email",
          valido,
          "Insira um e-mail válido que termine com @gmail.com, @outlook.com, @live.com ou @hotmail.com."
        );
      }

      function validarContato() {
        const valido = contato.value.replace(/\D/g, "").length === 11;
        return definirValidacao(
          "contato",
          valido,
          "Insira um contato válido no formato (DDD) 9 9999-9999."
        );
      }

      function validarSenha() {
        const valido = senha.value !== "" && regexSenha.test(senha.value);
        return definirValidacao(
          "senha",
          valido,
          "A senha deve conter pelo menos 8 caracteres, 1 letra maiúscula, 1 letra minúscula, 1 número e 1 caractere especial. Caracteres especiais aceitos: ! @ # $ % & * . , ? _ - + ="
        );
      }

      function validarConfirmacaoSenha() {
        const valido =
          confirmacaoSenha.value !== "" &&
          confirmacaoSenha.value === senha.value;
        return definirValidacao(
          "confirmacaoSenha",
          valido,
          "A senha não corresponde com a senha digitada anteriormente."
        );
      }

      function atualizarEstadoCadastro() {
        const primeiroValido =
          validarNomeCampo(
            primeiroNome,
            "primeiroNome",
            "Insira apenas texto no primeiro nome. Acentos são permitidos."
          );

        const sobrenomeValido =
          validarNomeCampo(
            sobrenome,
            "sobrenome",
            "Insira apenas texto no sobrenome completo. Acentos são permitidos."
          );

        const emailValido = validarEmail();
        const contatoValido = validarContato();
        const senhaValida = validarSenha();
        const confirmacaoValida = validarConfirmacaoSenha();

        const todosMarcados =
          checkboxes.every(function(checkbox) {
            return checkbox.checked;
          });

        botaoContinuar.disabled = !(
          primeiroValido &&
          sobrenomeValido &&
          emailValido &&
          contatoValido &&
          senhaValida &&
          confirmacaoValida &&
          todosMarcados
        );
      }

      function configurarOlho(botao, campo) {
        botao.addEventListener("click", function() {
          const mostrando = campo.type === "text";
          campo.type = mostrando ? "password" : "text";
          botao.innerHTML = mostrando
            ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Zm9.5 3a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg>'
            : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.9A11 11 0 0 1 12 5c6 0 9.5 7 9.5 7a16.3 16.3 0 0 1-3.1 3.7M6.4 6.4C3.9 8.1 2.5 12 2.5 12s3.5 7 9.5 7c1.5 0 2.8-.4 4-.9"/></svg>';
          botao.setAttribute("aria-label", mostrando ? "Mostrar senha" : "Ocultar senha");
          botao.setAttribute("title", mostrando ? "Mostrar senha" : "Ocultar senha");
        });
      }

      configurarOlho(
        document.getElementById("btnMostrarSenha"),
        senha
      );

      configurarOlho(
        document.getElementById("btnMostrarConfirmacaoSenha"),
        confirmacaoSenha
      );

      contato.addEventListener("input", function() {
        contato.value = formatarContato(contato.value);
        atualizarEstadoCadastro();
      });

      camposCadastro.forEach(function(campo) {
        if (campo !== contato) {
          campo.addEventListener("input", atualizarEstadoCadastro);
          campo.addEventListener("blur", atualizarEstadoCadastro);
        }
      });

      checkboxes.forEach(function(checkbox) {
        checkbox.addEventListener("change", atualizarEstadoCadastro);
      });

      botaoContinuar.addEventListener("click", async function() {
        atualizarEstadoCadastro();

        if (botaoContinuar.disabled) {
          return;
        }

        botaoContinuar.disabled =
          true;

        botaoContinuar.textContent =
          "Verificando...";

        try {

          const resultado =
            await chamarAPI({
              acao: "verificarDisponibilidadeCadastro",
              email: email.value.trim().toLowerCase(),
              contato: contato.value.replace(/\D/g, "")
            });

          if (!resultado || !resultado.sucesso) {
            throw new Error(
              (resultado && resultado.erro) ||
              "Não foi possível verificar os dados do cadastro."
            );
          }

          let encontrouErro =
            false;

          if (!resultado.emailDisponivel) {

            definirValidacao(
              "email",
              false,
              resultado.erroEmail ||
              "Este e-mail já possui cadastro."
            );

            encontrouErro =
              true;

          }

          if (!resultado.contatoDisponivel) {

            definirValidacao(
              "contato",
              false,
              resultado.erroContato ||
              "Este contato já possui cadastro."
            );

            encontrouErro =
              true;

          }

          if (encontrouErro) {
            return;
          }

          window.dadosCadastro = {
            primeiroNome: primeiroNome.value.trim(),
            sobrenome: sobrenome.value.trim(),
            email: email.value.trim().toLowerCase(),
            contato: contato.value.replace(/\D/g, ""),
            senha: senha.value
          };

          apresentarConfirmacaoCadastro();

        } catch (erro) {

          console.error(
            "Erro ao verificar disponibilidade:",
            erro
          );

          alert(
            erro.message ||
            "Não foi possível verificar os dados do cadastro."
          );

        } finally {

          botaoContinuar.textContent =
            "Continuar";

          if (
            !document.getElementById(
              "btnContinuarCadastro"
            )?.disabled
          ) {
            botaoContinuar.disabled =
              false;
          }

        }
      });

      atualizarEstadoCadastro();
    }


    /* =====================================================
       TELA 3 — CONFIRMAÇÃO DE E-MAIL
    ===================================================== */

    function apresentarConfirmacaoCadastro() {

      status.textContent =
        "Validação do cadastro";

      conteudo.innerHTML = `
        <div class="tela-confirmacao-cadastro">

          <div class="confirmacao-titulo">
            Quase tudo pronto!
          </div>

          <div class="confirmacao-texto">

          </div>

          <div class="confirmacao-acoes">

            <button

            </button>

            <button

              class="botao-acesso secundario"
              id="btnNaoRecebiEmail"

          </div>

          <div

          <div

          >

            <div class="confirmacao-texto">

            </div>

            <div
              class="campo-reenvio"
              id="grupoReenvioEmail"
            >
              <label for="emailReenvio">

              </label>

              <input
                type="email"
                id="emailReenvio"
                autocomplete="email"
                value=""
              >

              <div
                class="mensagem-reenvio"
                id="erroReenvioEmail"
              ></div>
            </div>

            <div
              class="confirmacao-acoes"
              style="margin-top:14px;"
            >
              <button
                type="button"
                class="botao-acesso"

              >

              </button>
            </div>

          </div>

        </div>
      `;

      const botaoEnviar =
        document.getElementById(
          "btnEnviarEmailConfirmacao"
        );

      const botaoNaoRecebi =
        document.getElementById(
          "btnNaoRecebiEmail"
        );

      const mensagem =
        document.getElementById(
          "mensagemEnvioConfirmacao"
        );

      const areaReenvio =
        document.getElementById(
          "areaReenvioEmail"
        );

      const emailReenvio =
        document.getElementById(
          "emailReenvio"
        );

      const grupoReenvioEmail =
        document.getElementById(
          "grupoReenvioEmail"
        );

      const erroReenvioEmail =
        document.getElementById(
          "erroReenvioEmail"
        );

      const botaoReenviar =
        document.getElementById(
          "btnReenviarEmailConfirmacao"
        );


      if (!window.dadosCadastro) {

        mensagem.textContent =
          "Não foi possível localizar os dados do cadastro.";

        mensagem.style.display =
          "block";

        botaoEnviar.disabled =
          true;

        return;

      }


      emailReenvio.value =
        window.dadosCadastro.email || "";


      let intervaloContador =
        null;


      function iniciarContagemReenvio() {

        let segundosRestantes =
          90;

        botaoNaoRecebi.disabled =
          true;

        botaoNaoRecebi.textContent =
          "Não recebi o e-mail de confirmação (1:30)";


        intervaloContador =
          setInterval(function() {

            segundosRestantes--;

            const minutos =
              Math.floor(
                segundosRestantes / 60
              );

            const segundos =
              segundosRestantes % 60;

            botaoNaoRecebi.textContent =
              "Não recebi o e-mail de confirmação (" +
              minutos +
              ":" +
              String(segundos).padStart(2, "0") +
              ")";


            if (
              segundosRestantes <= 0
            ) {

              clearInterval(
                intervaloContador
              );

              intervaloContador =
                null;

              botaoNaoRecebi.disabled =
                false;

              botaoNaoRecebi.textContent =
                "Não recebi o e-mail de confirmação";

            }

          }, 1000);

      }


      function validarEmailReenvio() {

        const valor =
          emailReenvio.value
            .trim()
            .toLowerCase();

        const valido =
          valor !== "" &&
          /^[^\s@]+@(gmail|outlook|live|hotmail)\.com$/i.test(
            valor
          );


        if (valido) {

          grupoReenvioEmail.classList.remove(
            "tem-erro"
          );

          emailReenvio.classList.remove(
            "campo-invalido"
          );

          erroReenvioEmail.textContent =
            "";

          return true;

        }


        grupoReenvioEmail.classList.add(
          "tem-erro"
        );

        emailReenvio.classList.add(
          "campo-invalido"
        );

        erroReenvioEmail.textContent =
          "Insira um e-mail válido que termine com @gmail.com, @outlook.com, @live.com ou @hotmail.com.";

        return false;

      }


      emailReenvio.addEventListener(
        "input",
        function() {

          emailReenvio.value =
            emailReenvio.value
              .toLowerCase();

          validarEmailReenvio();

        }
      );


      botaoEnviar.addEventListener(
        "click",
        async function() {

          if (!window.dadosCadastro) {

            mensagem.textContent =
              "Não foi possível localizar os dados do cadastro.";

            mensagem.style.display =
              "block";

            return;

          }

          botaoEnviar.textContent =

          mensagem.style.display =
            "block";

          mensagem.textContent =
            "Registrando cadastro e enviando e-mail de confirmação.";


          try {

            const resultado =

                acao:
                  "cadastrarInstalador",

                primeiroNome:
                  window.dadosCadastro.primeiroNome,

                sobrenome:
                  window.dadosCadastro.sobrenome,

                email:
                  window.dadosCadastro.email,

                contato:
                  window.dadosCadastro.contato,

                senha:
                  window.dadosCadastro.senha

              });


            if (
              !resultado ||
              !resultado.sucesso
            ) {

              throw new Error(

                  resultado &&
                  resultado.erro
                ) ||
                "Não foi possível concluir o cadastro."

            );

              "Não foi possível concluir o cadastro.";


            botaoEnviar.disabled =

            botaoEnviar.textContent =

            "block";

          emailReenvio.value =
            window.dadosCadastro.email || "";

          emailReenvio.focus();

          botaoNaoRecebi.style.display =
            "none";

        }
      );


      botaoReenviar.addEventListener(
        "click",
        async function() {

          if (
            !window.dadosCadastro ||
            !window.dadosCadastro.id
          ) {

            mensagem.textContent =
              "Não foi possível identificar o cadastro para reenviar o e-mail.";

            mensagem.style.display =
              "block";

            return;

          }


          if (
            !validarEmailReenvio()
          ) {

            emailReenvio.focus();

            return;

          }


          const novoEmail =
            emailReenvio.value
              .trim()
              .toLowerCase();


          botaoReenviar.disabled =
            true;

          botaoReenviar.textContent =
            "Enviando...";


          mensagem.style.display =
            "block";

          mensagem.textContent =
            "Atualizando o e-mail e enviando uma nova confirmação.";


          try {

            const resultado =
              await chamarAPI({

                acao:
                  "reenviarEmailConfirmacao",

                id:
                  window.dadosCadastro.id,

                email:
                  novoEmail

              });


            if (
              !resultado ||
              !resultado.sucesso
            ) {

              throw new Error(
                (
                  resultado &&
                  resultado.erro
                ) ||
                "Não foi possível reenviar o e-mail."
              );

            }


            window.dadosCadastro.email =
              resultado.email ||
              novoEmail;


            emailReenvio.value =
              window.dadosCadastro.email;


            mensagem.textContent =
              resultado.mensagem ||
              "Novo e-mail de confirmação enviado.";


            botaoReenviar.textContent =
              "E-mail reenviado";


            areaReenvio.style.display =
              "none";


            iniciarContagemReenvio();


          } catch (erro) {

            console.error(
              "Erro ao reenviar e-mail:",
              erro
            );


            mensagem.textContent =
              erro.message ||
              "Não foi possível reenviar o e-mail.";


            botaoReenviar.disabled =
              false;

            botaoReenviar.textContent =
              "Reenviar o e-mail de confirmação";

          }

        }
      );

    }

    /* =====================================================
       INICIAR ATENDIMENTO APÓS INTRODUÇÃO
    ===================================================== */

    function iniciarAtendimento() {

      const inputNome =
        document.getElementById("nomeInstalador");

      const inputRevenda =
        document.getElementById("revenda");


      const revenda =
        inputRevenda
          ? inputRevenda.value.trim()
          : "";


      if (window.modoSemCadastro) {

        const nome =
          inputNome
            ? inputNome.value.trim()
            : "";


        if (!nome) {

          alert(
            "Informe o nome do instalador."
          );

          inputNome.focus();

          return;

        }


        window.nomeInstalador =
          nome;

      }


      if (!revenda) {

        alert(
          "Informe o nome da revenda."
        );

        if (inputRevenda) {
          inputRevenda.focus();
        }

        return;

      }


      window.revenda =
        revenda;


      console.log(
        "Instalador:",
        window.nomeInstalador
      );

      console.log(
        "ID do instalador:",
        window.idInstalador
      );

      console.log(
        "Revenda:",

    /* =====================================================
       ENVIAR RESPOSTA DO DIAGNÓSTICO
    ===================================================== */

    async function enviarRespostaDiagnostico(
      resposta,
      etapa
    ) {

      const problema =
        window.problemaSelecionado;


      if (!problema) {

        console.error(
          "Nenhum problema selecionado."
        );

        return;

      }


      status.textContent =
        "Processando resposta...";

      conteudo.innerHTML =
        '<div class="loading">Processando resposta...</div>';


      try {

        const resultado =
          await chamarAPI({

            acao:
              "responderDiagnostico",

            problemaId:
              problema.id,

            resposta:
              resposta,

            motorId:
              window.motorSelecionado.id,

            controleId:
              window.controleSelecionado.id,

            etapa:
              etapa

          });


        console.log(
          "Resposta do diagnóstico:",
          resultado
        );


        if (!resultado.sucesso) {

          throw new Error(
            resultado.erro ||
            "Não foi possível processar a resposta."
          );

        }


        processarResultadoDiagnostico(
          resultado
        );


      } catch (erro) {

        console.error(erro);

        status.textContent =
          "Erro ao processar o diagnóstico.";

        conteudo.innerHTML =
          '<div class="error">' +
          erro.message +
          '</div>';

      }

    }


    /* =====================================================
       PROCESSAR RESULTADO DO DIAGNÓSTICO
    ===================================================== */

    function processarResultadoDiagnostico(
      resultado
    ) {

      console.log(
        "Processando fluxo:",
        resultado
      );


      if (
        resultado.tipo === "problema" &&
        resultado.problema
      ) {

        window.problemaSelecionado =
          resultado.problema;


        apresentarDiagnostico(
          resultado.problema
        );


        return;

      }


      if (
        resultado.tipo === "confirmacao"
      ) {

        apresentarConfirmacao(
          resultado
        );


        return;

      }


      if (
        resultado.tipo === "procedimento"
      ) {

        apresentarProcedimento(
          resultado.procedimento
        );


        return;

      }


      if (
        resultado.tipo === "fim"
      ) {

        apresentarFim(
          resultado.mensagem
        );


        return;

      }


      if (
        resultado.tipo === "escalar"
      ) {

        apresentarFim(
          resultado.mensagem
        );


        return;

      }


      throw new Error(
        "Tipo de resultado não reconhecido."
      );

    }

        document.createElement("div");

      nota.className =
        "avaliacao-nota";

      nota.textContent =
        "Selecione uma avaliação";


      container.appendChild(
        nota
      );


      const campoFeedback =
        document.createElement("div");

      campoFeedback.className =
        "campo-feedback";


      const labelFeedback =
        document.createElement("label");

      labelFeedback.textContent =
        "Gostaria de deixar algum comentário?";


      const textarea =
        document.createElement("textarea");

      textarea.id =
        "feedback";

      textarea.placeholder =
        "Conte-nos como podemos melhorar o atendimento...";


      campoFeedback.appendChild(
        labelFeedback
      );

      campoFeedback.appendChild(
        textarea
      );


      container.appendChild(
        campoFeedback
      );


      const botaoEnviar =
        document.createElement("button");

      botaoEnviar.className =
        "botao-avaliacao";

      botaoEnviar.textContent =
        "Enviar avaliação";

      botaoEnviar.disabled =
        true;


      botaoEnviar.addEventListener(
        "click",
        function() {

          finalizarAvaliacao(
            textarea,
            botaoEnviar
          );

        }
      );


      container.appendChild(
        botaoEnviar
      );


      conteudo.appendChild(
        container
      );

    }


    /* =====================================================
       SELECIONAR ESTRELA
    ===================================================== */

    function selecionarEstrela(
      quantidade,
      containerEstrelas,
      elementoNota
    ) {

      window.avaliacaoSelecionada =
        quantidade;


      const estrelas =
        containerEstrelas.querySelectorAll(
          ".estrela"
        );


      estrelas.forEach(
        function(estrela, indice) {

          if (
            indice < quantidade
          ) {

            estrela.classList.add(
              "selecionada"
            );

          } else {

            estrela.classList.remove(
              "selecionada"
            );

          }

        }
      );


      const descricoes = {

        1:
          "Muito ruim",

        2:
          "Ruim",

        3:
          "Regular",

        4:
          "Bom",

        5:
          "Excelente"

      };


      elementoNota.textContent =
        quantidade +
        " de 5 — " +
        descricoes[quantidade];


      const botaoEnviar =
        document.querySelector(
          ".botao-avaliacao"
        );


      if (botaoEnviar) {

        botaoEnviar.disabled =
          false;

      }

    }


    /* =====================================================
       FINALIZAR AVALIAÇÃO
       
       ALTERADO:
       Registra o atendimento no Apps Script
       antes de apresentar a confirmação.
    ===================================================== */

    async function finalizarAvaliacao(
      textarea,
      botaoEnviar
    ) {

      if (
        !window.avaliacaoSelecionada
      ) {

        alert(
          "Selecione uma avaliação antes de continuar."
        );

        return;

      }


      window.feedback =
        textarea.value.trim();


      console.log(
        "Preparando registro do atendimento..."
      );

      console.log(
        "Instalador:",
        window.nomeInstalador
      );

      console.log(
        "Revenda:",
        window.revenda
      );

      console.log(
        "Motor:",
        window.motorSelecionado
      );

      console.log(
        "Controle:",
        window.controleSelecionado
      );

      console.log(
        "Problema:",
        window.problemaSelecionado
      );

      console.log(
        "Avaliação:",
        window.avaliacaoSelecionada
      );

      console.log(
        "Feedback:",
        window.feedback
      );


      /*
       * Evita duplo envio da avaliação.
       */

      if (botaoEnviar) {

        botaoEnviar.disabled =
          true;

        botaoEnviar.textContent =
          "Registrando atendimento...";

      }


      status.textContent =
        "Registrando atendimento...";

      conteudo.innerHTML =
        '<div class="loading">Registrando atendimento...</div>';


      try {

        /*
         * ENVIO PARA O APPS SCRIPT
         */

        const resultado =
          await chamarAPI({

            acao:
              "registrarAtendimento",

            nomeInstalador:
              window.nomeInstalador,

            revenda:
              window.revenda,

            motorId:
              window.motorSelecionado
                ? window.motorSelecionado.id
                : "",

            controleId:
              window.controleSelecionado
                ? window.controleSelecionado.id
                : "",

            problemaId:
              window.problemaSelecionado
                ? window.problemaSelecionado.id
                : "",

            avaliacao:
              window.avaliacaoSelecionada,

            feedback:
              window.feedback

          });


        console.log(
          "Resposta do registro do atendimento:",
          resultado
        );


        /*
         * O Apps Script precisa retornar
         * sucesso: true para confirmar a gravação.
         */

        if (
          !resultado ||
          !resultado.sucesso
        ) {

          throw new Error(
            resultado.erro ||
            "Não foi possível registrar o atendimento na planilha."
          );

        }


        console.log(
          "Atendimento registrado com sucesso."
        );


        apresentarConfirmacaoAvaliacao();


      } catch (erro) {

        console.error(
          "Erro ao registrar atendimento:",
          erro
        );


        status.textContent =
          "Erro ao registrar atendimento.";


        conteudo.innerHTML =
          '<div class="error">' +
          "Não foi possível registrar o atendimento. " +
          "Tente novamente." +
          '</div>';


        /*
         * Permite tentar novamente.
         */

        const botaoTentar =
          document.createElement("button");

        botaoTentar.className =
          "botao-avaliacao";

        botaoTentar.textContent =
          "Tentar novamente";


        botaoTentar.addEventListener(
          "click",
          function() {

            finalizarAvaliacao(
              textarea,
              botaoTentar
            );

          }
        );


        conteudo.appendChild(
          botaoTentar
        );

      }

    }


    /* =====================================================
       CONFIRMAÇÃO DA AVALIAÇÃO
    ===================================================== */

    function apresentarConfirmacaoAvaliacao() {

      status.textContent =
        "Avaliação registrada";

      conteudo.innerHTML =
        "";


      const container =
        document.createElement("div");

      container.className =
        "finalizacao";


      const icone =
        document.createElement("div");

      icone.className =
        "finalizacao-icone";

      icone.textContent =
        "✓";


      container.appendChild(
        icone
      );


      const titulo =
        document.createElement("div");

      titulo.className =
        "resultado-titulo";

      titulo.textContent =
        "Obrigado pela sua avaliação!";


      container.appendChild(
        titulo
      );


      const texto =
        document.createElement("div");

      texto.className =
        "finalizacao-texto";

      texto.textContent =
        "Seu feedback é importante para continuarmos melhorando o Assistente Técnico Amorim Motorização.";


      container.appendChild(
        texto
      );


      conteudo.appendChild(
        container
      );

    }


    /* =====================================================
       CONFIRMAR E-MAIL
    ===================================================== */

    function verificarEmail() {

      const parametros =
        new URLSearchParams(
          window.location.search
        );

      const token =
        parametros.get("verificar");

      const tokenRecuperacao =
        parametros.get("recuperar");

      const resultado =
        parametros.get("verificacao");


      if (resultado === "sucesso") {
        apresentarConfirmacaoEmail();
        return;
      }

      if (resultado === "ja-confirmado") {
        apresentarConfirmacaoEmail();
        return;
      }

      if (resultado === "erro") {
        apresentarErroVerificacao();
        return;
      }

      if (tokenRecuperacao) {
        apresentarRedefinicaoSenha(tokenRecuperacao);
        return;
      }

      if (!token) {
        apresentarTelaInicial();
        return;
      }

      status.textContent =
        "Confirmando cadastro...";

      conteudo.innerHTML =
        '<div class="loading">Confirmando seu e-mail...</div>';

      window.receberConfirmacaoEmail =
        function(resultado) {

          console.log(
            "Resposta da confirmação:",
            resultado
          );

          if (
            resultado &&
            resultado.sucesso
          ) {
            apresentarConfirmacaoEmail();
            return;
          }

          apresentarErroVerificacao();

        };

      const script =
        document.createElement("script");

      script.src =
        URL_VERIFICACAO +
        "?verificar=" +
        encodeURIComponent(token) +
        "&callback=receberConfirmacaoEmail";

      script.onerror =
        function() {

          console.error(
            "Não foi possível consultar a confirmação."
          );

          apresentarErroVerificacao();

        };

      document.body.appendChild(
        script
      );

    }

    /* =====================================================
       CONFIRMAÇÃO DE E-MAIL — SUCESSO
    ===================================================== */

    function apresentarConfirmacaoEmail() {

      status.textContent =
        "Cadastro ativo";

      conteudo.innerHTML =
        "";

      const container =
        document.createElement("div");

      container.className =
        "verificacao";

      const icone =
        document.createElement("div");

      icone.className =
        "verificacao-icone";

      icone.textContent =
        "✓";

      container.appendChild(
        icone
      );

      const titulo =
        document.createElement("div");

      titulo.className =
        "verificacao-titulo";

      titulo.textContent =
        "Cadastro ativado!";

      container.appendChild(
        titulo
      );

      const texto =
        document.createElement("div");

      texto.className =
        "verificacao-texto";

      texto.textContent =
        "Seu e-mail foi confirmado e seu cadastro está ativo. Você já pode voltar ao aplicativo e fazer login.";

      container.appendChild(
        texto
      );

      const botao =
        document.createElement("a");

      botao.className =
        "verificacao-botao";

      botao.href =
        window.location.origin +
        window.location.pathname;

      botao.textContent =
        "Voltar ao Assistente Técnico";

      container.appendChild(
        botao
      );

      conteudo.appendChild(
        container
      );

    }


    /* =====================================================
       CONFIRMAÇÃO DE E-MAIL — ERRO
    ===================================================== */

    function apresentarErroVerificacao() {

      status.textContent =
        "Não foi possível confirmar";

      conteudo.innerHTML =
        "";

      const container =
        document.createElement("div");

      container.className =
        "verificacao";

      const icone =
        document.createElement("div");

      icone.className =
        "verificacao-icone";

      icone.textContent =
        "!";

      container.appendChild(
        icone
      );

      const titulo =
        document.createElement("div");

      titulo.className =
        "verificacao-titulo";

      titulo.textContent =
        "Link de confirmação inválido";

      container.appendChild(
        titulo
      );

      const texto =
        document.createElement("div");

      texto.className =
        "verificacao-texto";

      texto.textContent =
        "O link pode ter expirado, já ter sido utilizado ou não ser válido. Solicite um novo link de confirmação se necessário.";

      container.appendChild(
        texto
      );

      const botao =
        document.createElement("a");

      botao.className =
        "verificacao-botao";

      botao.href =
        window.location.origin +
        window.location.pathname;

      botao.textContent =
        "Voltar ao Assistente Técnico";

      container.appendChild(
        botao
      );

      conteudo.appendChild(
        container
      );

    }


    /* =====================================================
       INICIAR
    ===================================================== */

    verificarEmail();

  </script>
