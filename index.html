<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Amorim Motorização</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 700px;
      min-height: 100vh;
      background: #fff;
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .status {
      color: #777;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .question {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .choice {
      width: 100%;
      min-height: 60px;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 12px;
      background: #fff;
      text-align: left;
      font-size: 17px;
      cursor: pointer;
    }

    .choice:hover {
      background: #f2f2f2;
    }

    .loading {
      padding: 16px;
      border-radius: 12px;
      background: #f0f0f0;
      color: #666;
    }

    .error {
      padding: 16px;
      border-radius: 12px;
      background: #ffecec;
      color: #a00;
    }

    .resultado {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .resultado-titulo {
      font-size: 22px;
      font-weight: bold;
      line-height: 1.3;
    }

    .resultado-bloco {
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fafafa;
    }

    .resultado-label {
      font-size: 14px;
      font-weight: bold;
      color: #777;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .resultado-texto {
      font-size: 17px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .botao-video {
      width: 100%;
      min-height: 55px;
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .botao-video:hover {
      background: #444;
    }

    .botao-reiniciar {
      width: 100%;
      min-height: 55px;
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: #fff;
      font-size: 17px;
      cursor: pointer;
    }

    .botao-reiniciar:hover {
      background: #444;
    }

    /* =========================
       INTRODUÇÃO
    ========================= */

    .introducao {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .introducao-texto {
      font-size: 17px;
      line-height: 1.55;
      color: #333;
      white-space: pre-line;
    }

    .aviso-inicial {
      padding: 16px;
      border: 1px solid #ddd;
      border-left: 4px solid #222;
      border-radius: 12px;
      background: #fafafa;
      color: #333;
      font-size: 15px;
      line-height: 1.5;
    }

    .aviso-inicial strong {
      display: block;
      margin-bottom: 6px;
    }

    .campo-introducao {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .campo-introducao label {
      font-size: 14px;
      font-weight: bold;
      color: #555;
    }

    .campo-introducao input {
      width: 100%;
      min-height: 55px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 17px;
      outline: none;
    }

    .campo-introducao input:focus {
      border-color: #888;
    }

    .botao-continuar {
      width: 100%;
      min-height: 55px;
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .botao-continuar:hover {
      background: #444;
    }

    .botao-continuar:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* =========================
       AVALIAÇÃO
    ========================= */

    .avaliacao {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .avaliacao-texto {
      font-size: 17px;
      line-height: 1.55;
      color: #333;
    }

    .estrelas {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 8px 0;
    }

    .estrela {
      border: none;
      background: transparent;
      font-size: 42px;
      line-height: 1;
      color: #ccc;
      cursor: pointer;
      padding: 4px;
      transition: transform 0.15s ease;
    }

    .estrela:hover {
      transform: scale(1.08);
    }

    .estrela.selecionada {
      color: #f5b301;
    }

    .avaliacao-nota {
      text-align: center;
      font-size: 14px;
      color: #777;
      min-height: 20px;
    }

    .campo-feedback {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .campo-feedback label {
      font-size: 14px;
      font-weight: bold;
      color: #555;
    }

    .campo-feedback textarea {
      width: 100%;
      min-height: 120px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }

    .campo-feedback textarea:focus {
      border-color: #888;
    }

    .campo-feedback textarea::placeholder {
      color: #999;
    }

    .botao-avaliacao {
      width: 100%;
      min-height: 55px;
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .botao-avaliacao:hover {
      background: #444;
    }

    .botao-avaliacao:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* =========================
       FINALIZAÇÃO
    ========================= */

    .finalizacao {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

    .finalizacao-icone {
      font-size: 48px;
    }

    .finalizacao-texto {
      font-size: 17px;
      line-height: 1.55;
      color: #333;
    }


    /* =========================
       CONFIRMAÇÃO DE E-MAIL
    ========================= */

    .verificacao {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
      padding: 40px 20px;
    }

    .verificacao-icone {
      font-size: 52px;
      line-height: 1;
    }

    .verificacao-titulo {
      font-size: 24px;
      font-weight: bold;
    }

    .verificacao-texto {
      font-size: 17px;
      line-height: 1.55;
      color: #333;
      max-width: 520px;
    }

    .verificacao-botao {
      width: 100%;
      max-width: 360px;
      min-height: 55px;
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .verificacao-botao:hover {
      background: #444;
    }

  </style>

</head>

<body>

  <div class="app">

    <h1>Amorim Motorização</h1>

    <div
      id="status"
      class="status"
    >
      Iniciando atendimento...
    </div>

    <div id="conteudo"></div>

  </div>


  <script>

    /* =====================================================
       URL DO WEB APP
    ===================================================== */

    const URL_API =
      "https://script.google.com/macros/s/AKfycbz8P23T3_yuIUCIICEw9lZ3msR9MrbtXCEkAE5tfHmJcDVLjRS5Xt0XEW73hzOETnz1Fw/exec";


    /* =====================================================
       URL PARA CONFIRMAÇÃO DE E-MAIL
    ===================================================== */

    const URL_VERIFICACAO =
      "https://script.google.com/macros/s/AKfycbx3HlA3Y_TA3isEe84CmydN815o83DE4wiwuBh719VcFFHVnDu8mLYgMxIfVtd5AQYP/exec";


    /* =====================================================
       ELEMENTOS DA TELA
    ===================================================== */

    const status =
      document.getElementById("status");

    const conteudo =
      document.getElementById("conteudo");


    /* =====================================================
       ESTADO DO ATENDIMENTO
    ===================================================== */

    window.nomeInstalador = "";

    window.revenda = "";

    window.motorSelecionado = null;

    window.controleSelecionado = null;

    window.problemaSelecionado = null;

    window.avaliacaoSelecionada = 0;

    window.feedback = "";


    /* =====================================================
       CHAMADA PARA O APPS SCRIPT
    ===================================================== */

    async function chamarAPI(dados) {

      const resposta =
        await fetch(
          URL_API,
          {
            method: "POST",

            headers: {
              "Content-Type": "text/plain"
            },

            body: JSON.stringify(dados)
          }
        );


      return await resposta.json();

    }


    /* =====================================================
       INTRODUÇÃO
    ===================================================== */

    function apresentarIntroducao() {

      status.textContent =
        "Identificação do atendimento";

      conteudo.innerHTML =
        "";


      const container =
        document.createElement("div");

      container.className =
        "introducao";


      const texto =
        document.createElement("div");

      texto.className =
        "introducao-texto";

      texto.textContent =
        "Olá! Seja bem-vindo ao Assistente Técnico.\n\n" +
        "Antes de começarmos, preciso de algumas informações para registrar o atendimento.";


      container.appendChild(
        texto
      );


      const aviso =
        document.createElement("div");

      aviso.className =
        "aviso-inicial";

      aviso.innerHTML =
        "<strong>Importante</strong>" +
        "Este Assistente Técnico é destinado exclusivamente " +
        "à orientação relacionada à programação de motores. " +
        "As orientações apresentadas são baseadas na base técnica cadastrada. " +
        "Caso a situação não possua uma orientação compatível, " +
        "o atendimento deverá ser direcionado para a fábrica.";


      container.appendChild(
        aviso
      );


      const campoNome =
        document.createElement("div");

      campoNome.className =
        "campo-introducao";


      const labelNome =
        document.createElement("label");

      labelNome.textContent =
        "Nome do instalador";


      const inputNome =
        document.createElement("input");

      inputNome.type =
        "text";

      inputNome.id =
        "nomeInstalador";

      inputNome.placeholder =
        "Digite seu nome";

      inputNome.autocomplete =
        "name";


      campoNome.appendChild(
        labelNome
      );

      campoNome.appendChild(
        inputNome
      );


      container.appendChild(
        campoNome
      );


      const campoRevenda =
        document.createElement("div");

      campoRevenda.className =
        "campo-introducao";


      const labelRevenda =
        document.createElement("label");

      labelRevenda.textContent =
        "Revenda";


      const inputRevenda =
        document.createElement("input");

      inputRevenda.type =
        "text";

      inputRevenda.id =
        "revenda";

      inputRevenda.placeholder =
        "Digite o nome da revenda";


      campoRevenda.appendChild(
        labelRevenda
      );

      campoRevenda.appendChild(
        inputRevenda
      );


      container.appendChild(
        campoRevenda
      );


      const botao =
        document.createElement("button");

      botao.className =
        "botao-continuar";

      botao.textContent =
        "Continuar";


      botao.addEventListener(
        "click",
        function() {

          iniciarAtendimento();

        }
      );


      container.appendChild(
        botao
      );


      conteudo.appendChild(
        container
      );


      inputNome.focus();

    }


    /* =====================================================
       INICIAR ATENDIMENTO APÓS INTRODUÇÃO
    ===================================================== */

    function iniciarAtendimento() {

      const inputNome =
        document.getElementById("nomeInstalador");

      const inputRevenda =
        document.getElementById("revenda");


      if (!inputNome || !inputRevenda) {

        listarMotores();

        return;

      }


      const nome =
        inputNome.value.trim();

      const revenda =
        inputRevenda.value.trim();


      if (!nome) {

        alert(
          "Informe o nome do instalador."
        );

        inputNome.focus();

        return;

      }


      if (!revenda) {

        alert(
          "Informe o nome da revenda."
        );

        inputRevenda.focus();

        return;

      }


      window.nomeInstalador =
        nome;

      window.revenda =
        revenda;


      console.log(
        "Instalador:",
        window.nomeInstalador
      );

      console.log(
        "Revenda:",
        window.revenda
      );


      listarMotores();

    }


    /* =====================================================
       LISTAR MOTORES
    ===================================================== */

    async function listarMotores() {

      status.textContent =
        "Carregando motores...";

      conteudo.innerHTML =
        '<div class="loading">Carregando motores...</div>';


      try {

        const resultado =
          await chamarAPI({
            acao: "listarMotores"
          });


        console.log(
          "Resposta dos motores:",
          resultado
        );


        if (!resultado.sucesso) {

          throw new Error(
            resultado.erro ||
            "Não foi possível carregar os motores."
          );

        }


        apresentarMotores(
          resultado.motores
        );


      } catch (erro) {

        console.error(erro);

        status.textContent =
          "Erro ao conectar à base.";

        conteudo.innerHTML =
          '<div class="error">' +
          erro.message +
          '</div>';

      }

    }


    /* =====================================================
       APRESENTAR MOTORES
    ===================================================== */

    function apresentarMotores(motores) {

      status.textContent =
        "Selecione o motor:";

      conteudo.innerHTML =
        "";


      const question =
        document.createElement("div");

      question.className =
        "question";

      question.textContent =
        "Qual motor está sendo utilizado?";


      conteudo.appendChild(
        question
      );


      const choices =
        document.createElement("div");

      choices.className =
        "choices";


      motores.forEach(
        function(motor) {

          const button =
            document.createElement("button");

          button.className =
            "choice";

          button.textContent =
            motor.caracteristica ||
            "Motor";


          button.addEventListener(
            "click",
            async function() {

              console.log(
                "Motor selecionado:",
                motor
              );


              window.motorSelecionado =
                motor;


              status.textContent =
                "Carregando controles...";

              conteudo.innerHTML =
                '<div class="loading">Carregando controles...</div>';


              try {

                const resultado =
                  await chamarAPI({
                    acao: "listarControles",
                    motorId: motor.id
                  });


                console.log(
                  "Resposta dos controles:",
                  resultado
                );


                if (!resultado.sucesso) {

                  throw new Error(
                    resultado.erro ||
                    "Não foi possível carregar os controles."
                  );

                }


                apresentarControles(
                  resultado.controles
                );


              } catch (erro) {

                console.error(erro);

                status.textContent =
                  "Erro ao carregar os controles.";

                conteudo.innerHTML =
                  '<div class="error">' +
                  erro.message +
                  '</div>';

              }

            }
          );


          choices.appendChild(
            button
          );

        }
      );


      conteudo.appendChild(
        choices
      );

    }


    /* =====================================================
       APRESENTAR CONTROLES
    ===================================================== */

    function apresentarControles(controles) {

      status.textContent =
        "Selecione o controle:";

      conteudo.innerHTML =
        "";


      const question =
        document.createElement("div");

      question.className =
        "question";

      question.textContent =
        "Qual controle está sendo utilizado?";


      conteudo.appendChild(
        question
      );


      const choices =
        document.createElement("div");

      choices.className =
        "choices";


      controles.forEach(
        function(controle) {

          const button =
            document.createElement("button");

          button.className =
            "choice";

          button.textContent =
            controle.caracteristica ||
            "Controle";


          button.addEventListener(
            "click",
            async function() {

              console.log(
                "Controle selecionado:",
                controle
              );


              window.controleSelecionado =
                controle;


              status.textContent =
                "Carregando problemas...";

              conteudo.innerHTML =
                '<div class="loading">Carregando problemas...</div>';


              try {

                const resultado =
                  await chamarAPI({

                    acao:
                      "listarProblemas",

                    motorId:
                      window.motorSelecionado.id,

                    controleId:
                      controle.id

                  });


                console.log(
                  "Resposta dos problemas:",
                  resultado
                );


                if (!resultado.sucesso) {

                  throw new Error(
                    resultado.erro ||
                    "Não foi possível carregar os problemas."
                  );

                }


                apresentarProblemas(
                  resultado.problemas
                );


              } catch (erro) {

                console.error(erro);

                status.textContent =
                  "Erro ao carregar os problemas.";

                conteudo.innerHTML =
                  '<div class="error">' +
                  erro.message +
                  '</div>';

              }

            }
          );


          choices.appendChild(
            button
          );

        }
      );


      conteudo.appendChild(
        choices
      );

    }


    /* =====================================================
       APRESENTAR PROBLEMAS
    ===================================================== */

    function apresentarProblemas(problemas) {

      status.textContent =
        "Selecione o problema:";

      conteudo.innerHTML =
        "";


      const question =
        document.createElement("div");

      question.className =
        "question";

      question.textContent =
        "Qual problema está acontecendo?";


      conteudo.appendChild(
        question
      );


      const choices =
        document.createElement("div");

      choices.className =
        "choices";


      problemas.forEach(
        function(problema) {

          const button =
            document.createElement("button");

          button.className =
            "choice";

          button.textContent =
            problema.situacao ||
            "Problema";


          button.addEventListener(
            "click",
            async function() {

              console.log(
                "Problema selecionado:",
                problema
              );


              status.textContent =
                "Carregando diagnóstico...";

              conteudo.innerHTML =
                '<div class="loading">Carregando diagnóstico...</div>';


              try {

                const resultado =
                  await chamarAPI({

                    acao:
                      "buscarProblema",

                    problemaId:
                      problema.id,

                    motorId:
                      window.motorSelecionado.id,

                    controleId:
                      window.controleSelecionado.id

                  });


                console.log(
                  "Resposta do problema:",
                  resultado
                );


                if (!resultado.sucesso) {

                  throw new Error(
                    resultado.erro ||
                    "Não foi possível carregar o diagnóstico."
                  );

                }


                const dadosProblema =
                  resultado.problema;


                console.log(
                  "Problema encontrado:",
                  dadosProblema
                );


                window.problemaSelecionado =
                  dadosProblema;


                apresentarDiagnostico(
                  dadosProblema
                );


              } catch (erro) {

                console.error(erro);

                status.textContent =
                  "Erro ao carregar o diagnóstico.";

                conteudo.innerHTML =
                  '<div class="error">' +
                  erro.message +
                  '</div>';

              }

            }
          );


          choices.appendChild(
            button
          );

        }
      );


      conteudo.appendChild(
        choices
      );

    }


    /* =====================================================
       APRESENTAR PERGUNTA DE DIAGNÓSTICO
    ===================================================== */

    function apresentarDiagnostico(problema) {

      status.textContent =
        "Diagnóstico";

      conteudo.innerHTML =
        "";


      const question =
        document.createElement("div");

      question.className =
        "question";

      question.textContent =
        problema.perguntasDiagnostico ||
        "Não há pergunta de diagnóstico cadastrada.";


      conteudo.appendChild(
        question
      );


      const choices =
        document.createElement("div");

      choices.className =
        "choices";


      const botaoSim =
        document.createElement("button");

      botaoSim.className =
        "choice";

      botaoSim.textContent =
        "Sim";


      botaoSim.addEventListener(
        "click",
        function() {

          enviarRespostaDiagnostico(
            "SIM",
            "diagnostico"
          );

        }
      );


      choices.appendChild(
        botaoSim
      );


      const botaoNao =
        document.createElement("button");

      botaoNao.className =
        "choice";

      botaoNao.textContent =
        "Não";


      botaoNao.addEventListener(
        "click",
        function() {

          enviarRespostaDiagnostico(
            "NAO",
            "diagnostico"
          );

        }
      );


      choices.appendChild(
        botaoNao
      );


      conteudo.appendChild(
        choices
      );

    }


    /* =====================================================
       ENVIAR RESPOSTA DO DIAGNÓSTICO
    ===================================================== */

    async function enviarRespostaDiagnostico(
      resposta,
      etapa
    ) {

      const problema =
        window.problemaSelecionado;


      if (!problema) {

        console.error(
          "Nenhum problema selecionado."
        );

        return;

      }


      status.textContent =
        "Processando resposta...";

      conteudo.innerHTML =
        '<div class="loading">Processando resposta...</div>';


      try {

        const resultado =
          await chamarAPI({

            acao:
              "responderDiagnostico",

            problemaId:
              problema.id,

            resposta:
              resposta,

            motorId:
              window.motorSelecionado.id,

            controleId:
              window.controleSelecionado.id,

            etapa:
              etapa

          });


        console.log(
          "Resposta do diagnóstico:",
          resultado
        );


        if (!resultado.sucesso) {

          throw new Error(
            resultado.erro ||
            "Não foi possível processar a resposta."
          );

        }


        processarResultadoDiagnostico(
          resultado
        );


      } catch (erro) {

        console.error(erro);

        status.textContent =
          "Erro ao processar o diagnóstico.";

        conteudo.innerHTML =
          '<div class="error">' +
          erro.message +
          '</div>';

      }

    }


    /* =====================================================
       PROCESSAR RESULTADO DO DIAGNÓSTICO
    ===================================================== */

    function processarResultadoDiagnostico(
      resultado
    ) {

      console.log(
        "Processando fluxo:",
        resultado
      );


      if (
        resultado.tipo === "problema" &&
        resultado.problema
      ) {

        window.problemaSelecionado =
          resultado.problema;


        apresentarDiagnostico(
          resultado.problema
        );


        return;

      }


      if (
        resultado.tipo === "confirmacao"
      ) {

        apresentarConfirmacao(
          resultado
        );


        return;

      }


      if (
        resultado.tipo === "procedimento"
      ) {

        apresentarProcedimento(
          resultado.procedimento
        );


        return;

      }


      if (
        resultado.tipo === "fim"
      ) {

        apresentarFim(
          resultado.mensagem
        );


        return;

      }


      if (
        resultado.tipo === "escalar"
      ) {

        apresentarFim(
          resultado.mensagem
        );


        return;

      }


      throw new Error(
        "Tipo de resultado não reconhecido."
      );

    }

    ===================================================== */

    function selecionarEstrela(
      quantidade,
      containerEstrelas,
      elementoNota
    ) {

      window.avaliacaoSelecionada =
        quantidade;


      const estrelas =
        containerEstrelas.querySelectorAll(
          ".estrela"
        );


      estrelas.forEach(
        function(estrela, indice) {

          if (
            indice < quantidade
          ) {

            estrela.classList.add(
              "selecionada"
            );

          } else {

            estrela.classList.remove(
              "selecionada"
            );

          }

        }
      );


      const descricoes = {

        1:
          "Muito ruim",

        2:
          "Ruim",

        3:
          "Regular",

        4:
          "Bom",

        5:
          "Excelente"

      };


      elementoNota.textContent =
        quantidade +
        " de 5 — " +
        descricoes[quantidade];


      const botaoEnviar =
        document.querySelector(
          ".botao-avaliacao"
        );


      if (botaoEnviar) {

        botaoEnviar.disabled =
          false;

      }

    }

       FINALIZAR AVALIAÇÃO
       
       ALTERADO:
       Registra o atendimento no Apps Script
       antes de apresentar a confirmação.
    ===================================================== */

    async function finalizarAvaliacao(
      textarea,
      botaoEnviar
    ) {

      if (
        !window.avaliacaoSelecionada
      ) {

        alert(
          "Selecione uma avaliação antes de continuar."
        );

        return;

      }


      window.feedback =
        textarea.value.trim();


      console.log(
        "Preparando registro do atendimento..."
      );

      console.log(
        "Instalador:",
        window.nomeInstalador
      );

      console.log(
        "Revenda:",
        window.revenda
      );

      console.log(
        "Motor:",
        window.motorSelecionado
      );

      console.log(
        "Controle:",
        window.controleSelecionado
      );

      console.log(
        "Problema:",
        window.problemaSelecionado
      );

      console.log(
        "Avaliação:",
        window.avaliacaoSelecionada
      );

      console.log(
        "Feedback:",
        window.feedback
      );


      /*
       * Evita duplo envio da avaliação.
       */

      if (botaoEnviar) {

        botaoEnviar.disabled =
          true;

        botaoEnviar.textContent =
          "Registrando atendimento...";

      }


      status.textContent =
        "Registrando atendimento...";

      conteudo.innerHTML =
        '<div class="loading">Registrando atendimento...</div>';


      try {

        /*
         * ENVIO PARA O APPS SCRIPT
         */

        const resultado =
          await chamarAPI({

            acao:
              "registrarAtendimento",

            nomeInstalador:
              window.nomeInstalador,

            revenda:
              window.revenda,

            motorId:
              window.motorSelecionado
                ? window.motorSelecionado.id
                : "",

            controleId:
              window.controleSelecionado
                ? window.controleSelecionado.id
                : "",

            problemaId:
              window.problemaSelecionado
                ? window.problemaSelecionado.id
                : "",

            avaliacao:
              window.avaliacaoSelecionada,

            feedback:
              window.feedback

          });


        console.log(
          "Resposta do registro do atendimento:",
          resultado
        );


        /*
         * O Apps Script precisa retornar
         * sucesso: true para confirmar a gravação.
         */

        if (
          !resultado ||
          !resultado.sucesso
        ) {

          throw new Error(
            resultado.erro ||
            "Não foi possível registrar o atendimento na planilha."
          );

        }


        console.log(
          "Atendimento registrado com sucesso."
        );


        apresentarConfirmacaoAvaliacao();


      } catch (erro) {

        console.error(
          "Erro ao registrar atendimento:",
          erro
        );


        status.textContent =
          "Erro ao registrar atendimento.";


        conteudo.innerHTML =
          '<div class="error">' +
          "Não foi possível registrar o atendimento. " +
          "Tente novamente." +
          '</div>';


        /*

          document.createElement("button");

        botaoTentar.className =
          "botao-avaliacao";

        botaoTentar.textContent =
          "Tentar novamente";


        botaoTentar.addEventListener(
          "click",
          function() {

            finalizarAvaliacao(
              textarea,
              botaoTentar
            );

          }
        );


        conteudo.appendChild(
          botaoTentar
        );

      }

    }

    /* =====================================================
       CONFIRMAR E-MAIL
    ===================================================== */

    function verificarEmail() {

      const parametros =
        new URLSearchParams(
          window.location.search
        );

      const token =
        parametros.get("verificar");

      const resultado =
        parametros.get("verificacao");


      /* -----------------------------------------------------
         RESULTADO DA CONFIRMAÇÃO
      ----------------------------------------------------- */

      if (resultado === "sucesso") {

        apresentarConfirmacaoEmail();

        return;

      }


      if (resultado === "ja-confirmado") {

        apresentarConfirmacaoEmail();

        return;

      }


      if (resultado === "erro") {

        apresentarErroVerificacao();

        return;

      }


      /* -----------------------------------------------------
         ACESSO NORMAL
      ----------------------------------------------------- */

      if (!token) {

        apresentarIntroducao();

        return;

      }


      /* -----------------------------------------------------
         AGUARDA CONFIRMAÇÃO
      ----------------------------------------------------- */

      status.textContent =
        "Confirmando cadastro...";

      conteudo.innerHTML =
        '<div class="loading">Confirmando seu e-mail...</div>';


      /* -----------------------------------------------------
         CALLBACK RECEBIDO DO APPS SCRIPT
      ----------------------------------------------------- */

      window.receberConfirmacaoEmail =
        function(resultado) {

          console.log(
            "Resposta da confirmação:",
            resultado
          );


          if (
            resultado &&
            resultado.sucesso
          ) {

            apresentarConfirmacaoEmail();

            return;

          }


          apresentarErroVerificacao();

        };


      /* -----------------------------------------------------
         CONSULTA O APPS SCRIPT SEM REDIRECIONAR
      ----------------------------------------------------- */

      const script =
        document.createElement("script");


      script.src =
        URL_VERIFICACAO +
        "?verificar=" +
        encodeURIComponent(token) +
        "&callback=receberConfirmacaoEmail";


      script.onerror =
        function() {

          console.error(
            "Não foi possível consultar a confirmação."
          );

          apresentarErroVerificacao();

        };


      document.body.appendChild(
        script
      );

    }

      texto.className =
        "verificacao-texto";

      );

      conteudo.appendChild(
